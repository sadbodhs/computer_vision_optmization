site_name: Triton vs TensorRT vs DeepStream
site_description: Measured comparison of CV inference serving pipelines on an RTX 3090
repo_url: https://github.com/sadbodhs/computer_vision_optmization
repo_name: sadbodhs/computer_vision_optmization
docs_dir: site_src

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

nav:
  - Start here:
    - Introduction: index.md
    - Overview: overview.md
    - Use cases: use-cases.md
  - The measurements:
    - Methodology: methodology.md
    - Results: results.md
    - DeepStream: deepstream.md
  - Where the time goes:
    - Transport: transport.md
    - Stage decomposition: stage-decomposition.md
    - Model cost: model-scaling.md
    - Across architectures: model-zoo.md
  - Making it faster:
    - Batching: batching.md
    - Triton tuning: triton-tuning.md
    - CUDA graphs: cuda-graphs.md
    - In-graph NMS: in-graph-nms.md
    - Contention: contention.md
  - What it costs:
    - Accuracy: accuracy.md
    - Precision: precision.md
  - Practical:
    - Reproduce: reproduce.md
    - Roadmap: roadmap.md
